# Its own Komodo stack, not per-branch: mailboxes outlive any app deploy.
# The version is pinned on purpose. Stalwart 1.x cannot open a data store
# written by 0.x, and 0.x cannot open a 1.x store, so a floating tag takes
# mail down on the next deploy.
#
# The v1 volumes below are created and filled by the migration script
# (runbooks/scripts/stalwart-tor-migrate.sh in AlaqmarG/platform). They must
# exist and be populated before this file is deployed. The original
# brockcsc-stalwart-data and brockcsc-stalwart-etc volumes are no longer
# mounted; they stay on the host as the rollback copy.
networks:
  platform-net:
    external: true

services:
  stalwart:
    image: stalwartlabs/stalwart:${STALWART_TAG:-v1.0.3}
    container_name: brockcsc-stalwart
    restart: unless-stopped
    networks: [platform-net]
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - stalwart-v1-data:/var/lib/stalwart-v1
      - stalwart-logs:/var/log/stalwart
      - stalwart-v1-etc:/etc/stalwart
    environment:
      - STALWART_RECOVERY_ADMIN=${STALWART_ADMIN_USER}:${STALWART_ADMIN_SECRET}
      - OCI_SMTP_PASSWORD=${OCI_SMTP_PASSWORD}
    # Only autoconfig paths are routed; admin and JMAP stay on platform-net.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart-autoconfig.rule=(Host(`autoconfig.brockcsc.ca`) && PathPrefix(`/mail/config-v1.1.xml`)) || (Host(`autodiscover.brockcsc.ca`) && PathPrefix(`/autodiscover/`))"
      - "traefik.http.routers.stalwart-autoconfig.entrypoints=websecure"
      - "traefik.http.routers.stalwart-autoconfig.tls.certresolver=letsencrypt"
      - "traefik.http.services.stalwart-autoconfig.loadbalancer.server.port=8080"
      # mail.brockcsc.ca stays a host for IMAP/SMTP; the webmail moved.
      - "traefik.http.routers.mail-redirect.rule=Host(`mail.brockcsc.ca`)"
      - "traefik.http.routers.mail-redirect.entrypoints=websecure"
      - "traefik.http.routers.mail-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mail-redirect.service=stalwart-autoconfig"
      - "traefik.http.routers.mail-redirect.middlewares=mail-to-admin"
      - "traefik.http.middlewares.mail-to-admin.redirectregex.regex=^https://mail\\.brockcsc\\.ca/.*"
      - "traefik.http.middlewares.mail-to-admin.redirectregex.replacement=https://admin.brockcsc.ca/admin/mail"
      - "traefik.http.middlewares.mail-to-admin.redirectregex.permanent=true"

volumes:
  stalwart-v1-data:
    name: brockcsc-stalwart-v1-data
  stalwart-logs:
    name: brockcsc-stalwart-logs
  stalwart-v1-etc:
    name: brockcsc-stalwart-v1-etc
