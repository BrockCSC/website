# Shared across every environment - differences come entirely from env vars
# Komodo sets per Stack (image tag, hostname, secrets, DB).
networks:
  wayfarer-net:
    external: true

services:
  # Uploads volume ownership comes from the image: the Dockerfile creates
  # /data/uploads as nextjs:nodejs, which an empty volume inherits on first mount.
  app:
    image: brockcsc-ca:${IMAGE_TAG}
    pull_policy: never
    container_name: ${PROJECT_NAME}-app
    restart: unless-stopped
    networks: [wayfarer-net]
    volumes:
      - uploads:/data/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_SCHEMA=${DB_SCHEMA}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - ADMIN_ROLE=${ADMIN_ROLE}
      - ALUMNI_ROLE=${ALUMNI_ROLE}
      - APPROVER_ROLE=${APPROVER_ROLE}
      - SUPERUSER_ROLE=${SUPERUSER_ROLE}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - SESSION_JWT_SECRET=${SESSION_JWT_SECRET}
      - INVITE_CODE_SECRET=${INVITE_CODE_SECRET}
      - PORT=3000
      - UPLOAD_DIR=/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-app.rule=Host(`${SUBDOMAIN}`)"
      - "traefik.http.routers.${PROJECT_NAME}-app.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_NAME}-app.loadbalancer.server.port=3000"

volumes:
  uploads:
    name: brockcsc-uploads
    external: true
