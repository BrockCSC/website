name: Build & Deploy

on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/brockcsc/brockcsc-ca

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cache in the registry, not the Actions cache: that one is scoped per
      # branch, so every preview would start from cold.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

  # Deliberately not a gate on deploy: a new base-image CVE should shout, not
  # stop a hotfix. It lands in the Security tab either way.
  scan-image:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  resolve-target:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      env_name: ${{ steps.ctx.outputs.env_name }}
      url: ${{ steps.ctx.outputs.url }}
    steps:
      - id: ctx
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          if [[ -z "$VPS_HOST" ]]; then
            echo "::error::Repository variable VPS_HOST is not set."
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
            echo "url=https://brockcsc.ca" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=uat" >> "$GITHUB_OUTPUT"
            echo "url=https://uat.$VPS_HOST" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "url=https://$SLUG.$VPS_HOST" >> "$GITHUB_OUTPUT"
          fi

  deploy-stack:
    needs: [build-image, resolve-target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ needs.resolve-target.outputs.env_name }}
      url: ${{ needs.resolve-target.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync GitHub secrets to Komodo Variables
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          VAL_BROCKCSC_DB_PASSWORD: ${{ secrets.BROCKCSC_DB_PASSWORD }}
          VAL_BROCKCSC_KEYCLOAK_ISSUER: ${{ vars.BROCKCSC_KEYCLOAK_ISSUER }}
          VAL_BROCKCSC_KEYCLOAK_CLIENT_ID: ${{ vars.BROCKCSC_KEYCLOAK_CLIENT_ID }}
          VAL_BROCKCSC_KEYCLOAK_CLIENT_SECRET: ${{ secrets.BROCKCSC_KEYCLOAK_CLIENT_SECRET }}
          VAL_BROCKCSC_KEYCLOAK_ADMIN_CLIENT_ID: ${{ vars.BROCKCSC_KEYCLOAK_ADMIN_CLIENT_ID }}
          VAL_BROCKCSC_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.BROCKCSC_KEYCLOAK_ADMIN_CLIENT_SECRET }}
          VAL_BROCKCSC_SESSION_JWT_SECRET: ${{ secrets.BROCKCSC_SESSION_JWT_SECRET }}
          VAL_BROCKCSC_INVITE_CODE_SECRET: ${{ secrets.BROCKCSC_INVITE_CODE_SECRET }}
          VAL_BROCKCSC_STALWART_ADMIN_USER: ${{ vars.BROCKCSC_STALWART_ADMIN_USER }}
          VAL_BROCKCSC_STALWART_ADMIN_SECRET: ${{ secrets.BROCKCSC_STALWART_ADMIN_SECRET }}
          VAL_BROCKCSC_OCI_COMPARTMENT_OCID: ${{ secrets.BROCKCSC_OCI_COMPARTMENT_OCID }}
        run: |
          source .github/scripts/komodo.sh

          sync_var() {
            local name="$1" value="$2" is_secret="$3"
            if komodo /read "$(jq -n --arg name "$name" '{type:"GetVariable", params:{name:$name}}')" quiet >/dev/null; then
              komodo /write "$(jq -n --arg name "$name" --arg value "$value" \
                '{type:"UpdateVariableValue", params:{name:$name, value:$value}}')" >/dev/null
            else
              komodo /write "$(jq -n --arg name "$name" --arg value "$value" --argjson is_secret "$is_secret" \
                '{type:"CreateVariable", params:{name:$name, value:$value, is_secret:$is_secret}}')" >/dev/null
            fi
          }

          sync_var BROCKCSC_DB_PASSWORD "$VAL_BROCKCSC_DB_PASSWORD" true
          sync_var BROCKCSC_KEYCLOAK_ISSUER "$VAL_BROCKCSC_KEYCLOAK_ISSUER" false
          sync_var BROCKCSC_KEYCLOAK_CLIENT_ID "$VAL_BROCKCSC_KEYCLOAK_CLIENT_ID" false
          sync_var BROCKCSC_KEYCLOAK_CLIENT_SECRET "$VAL_BROCKCSC_KEYCLOAK_CLIENT_SECRET" true
          sync_var BROCKCSC_KEYCLOAK_ADMIN_CLIENT_ID "$VAL_BROCKCSC_KEYCLOAK_ADMIN_CLIENT_ID" false
          sync_var BROCKCSC_KEYCLOAK_ADMIN_CLIENT_SECRET "$VAL_BROCKCSC_KEYCLOAK_ADMIN_CLIENT_SECRET" true
          sync_var BROCKCSC_SESSION_JWT_SECRET "$VAL_BROCKCSC_SESSION_JWT_SECRET" true
          sync_var BROCKCSC_INVITE_CODE_SECRET "$VAL_BROCKCSC_INVITE_CODE_SECRET" true
          sync_var BROCKCSC_STALWART_ADMIN_USER "$VAL_BROCKCSC_STALWART_ADMIN_USER" false
          sync_var BROCKCSC_STALWART_ADMIN_SECRET "$VAL_BROCKCSC_STALWART_ADMIN_SECRET" true
          sync_var BROCKCSC_OCI_COMPARTMENT_OCID "$VAL_BROCKCSC_OCI_COMPARTMENT_OCID" true

      - id: deploy-context
        run: node komodo/deploy-context.mjs
        env:
          REF: ${{ github.ref }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Ensure and deploy the stack
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          STACK_NAME: ${{ steps.deploy-context.outputs.stack-name }}
          BRANCH: ${{ steps.deploy-context.outputs.branch }}
          ENVIRONMENT: ${{ steps.deploy-context.outputs.environment }}
        run: |
          source .github/scripts/komodo.sh

          # The repo is still cloned on the VPS, but only for the compose file -
          # the image itself already exists, built and pushed by the build job.
          config=$(jq -n --arg branch "$BRANCH" --arg environment "$ENVIRONMENT" '{
            server: "wayfarerbx-vps",
            repo: "BrockCSC/website",
            branch: $branch,
            git_provider: "github.com",
            file_paths: ["deploy/docker-compose.yml"],
            auto_pull: true,
            destroy_before_deploy: false,
            webhook_enabled: false,
            environment: $environment
          }')

          if komodo /read "$(jq -n --arg s "$STACK_NAME" '{type:"GetStack", params:{stack:$s}}')" quiet >/dev/null; then
            komodo /write "$(jq -n --arg id "$STACK_NAME" --argjson config "$config" \
              '{type:"UpdateStack", params:{id:$id, config:$config}}')" >/dev/null
          else
            komodo /write "$(jq -n --arg name "$STACK_NAME" --argjson config "$config" \
              '{type:"CreateStack", params:{name:$name, config:$config}}')" >/dev/null
          fi

          update=$(komodo /execute "$(jq -n --arg s "$STACK_NAME" '{type:"DeployStack", params:{stack:$s}}')")
          komodo_await "$update" 60 >/dev/null

      - uses: BrockCSC/komodo-deploy/ensure-action@v1
        with:
          komodo-host: ${{ vars.KOMODO_HOST }}
          komodo-api-key: ${{ secrets.KOMODO_API_KEY }}
          komodo-api-secret: ${{ secrets.KOMODO_API_SECRET }}
          action-name: brockcsc-preview-sweep
          script-path: komodo/actions/preview-sweep.ts
          schedule: "at 09:00 am"
          schedule-enabled: true
