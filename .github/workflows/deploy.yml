name: Build & Deploy

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brockcsc/brockcsc-ca

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

  scan-image:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  resolve-target:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      env_name: ${{ steps.ctx.outputs.env_name }}
      url: ${{ steps.ctx.outputs.url }}
    steps:
      - id: ctx
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          GITHUB_REF_FULL: ${{ github.ref }}
          GITHUB_REF_SHORT: ${{ github.ref_name }}
        run: |
          if [[ -z "$VPS_HOST" ]]; then
            echo "::error::Repository variable VPS_HOST is not set."
            exit 1
          fi
          if [[ "$GITHUB_REF_FULL" == refs/tags/* ]]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
            echo "url=https://brockcsc.ca" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_FULL" == "refs/heads/main" ]]; then
            echo "env_name=uat" >> "$GITHUB_OUTPUT"
            echo "url=https://uat.$VPS_HOST" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "$GITHUB_REF_SHORT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "url=https://$SLUG.$VPS_HOST" >> "$GITHUB_OUTPUT"
          fi

  deploy-stack:
    needs: [build-image, resolve-target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ needs.resolve-target.outputs.env_name }}
      url: ${{ needs.resolve-target.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: deploy-context
        run: node komodo/deploy-context.mjs
        env:
          REF: ${{ github.ref }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Ensure and deploy the stack
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_DEPLOY_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_DEPLOY_API_SECRET }}
          STACK_NAME: ${{ steps.deploy-context.outputs.stack-name }}
          KOMODO_SERVER: ${{ vars.KOMODO_SERVER }}
          BRANCH: ${{ steps.deploy-context.outputs.branch }}
          ENVIRONMENT: ${{ steps.deploy-context.outputs.environment }}
        run: |
          source .github/scripts/komodo.sh

          config=$(jq -n --arg branch "$BRANCH" --arg environment "$ENVIRONMENT" '{
            server: env.KOMODO_SERVER,
            repo: "BrockCSC/website",
            branch: $branch,
            git_provider: "github.com",
            file_paths: ["deploy/docker-compose.yml"],
            auto_pull: true,
            destroy_before_deploy: false,
            webhook_enabled: false,
            environment: $environment
          }')

          komodo_ensure_and_deploy_stack "$STACK_NAME" "$config" 60
