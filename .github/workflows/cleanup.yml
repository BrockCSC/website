name: Cleanup

on:
  delete:

permissions:
  contents: read

concurrency:
  group: cleanup-${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: ctx
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "stack_name=brockcsc-pr-$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete Komodo stack
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_DEPLOY_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_DEPLOY_API_SECRET }}
          STACK_NAME: ${{ steps.ctx.outputs.stack_name }}
        run: |
          source .github/scripts/komodo.sh
          komodo /write "$(jq -n --arg id "$STACK_NAME" '{type:"DeleteStack", params:{id:$id}}')" \
            || echo "::warning::DeleteStack failed (stack may not exist) - continuing, the daily sweep will catch it"

      - name: Remove preview checkout, volumes and schema
        env:
          SSH_KEY: ${{ secrets.BROCKCSC_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.BROCKCSC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BROCKCSC_DEPLOY_USER }}
          SLUG: ${{ steps.ctx.outputs.slug }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_deploy
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "cleanup-preview $SLUG" \
            || echo "::warning::Server cleanup failed - continuing, the daily sweep will catch it"
