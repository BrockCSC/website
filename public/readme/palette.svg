<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="The command palette: one search box over mail, people and events, with mail search operators">
  <title>⌘K command palette — one box over mail, people and events</title>

  <style>
    /* CSS keyframes, never SMIL: SMIL cannot be switched off by a media query.
       The caret rests visible, so the diagram is complete when it never runs. */
    .caret { animation: blink 1.2s steps(1, end) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; opacity: 1; } }

    .lbl { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Courier New', monospace; }
  </style>

  <rect x="26" y="26" width="820" height="440" rx="24" fill="#9A4440" />
  <rect x="16" y="16" width="820" height="440" rx="24" fill="#ffffff" stroke="#101012" stroke-width="3" />

  <rect x="48" y="44" width="196" height="30" rx="15" fill="#fff1f1" stroke="#9A4440" stroke-width="2" />
  <text class="lbl" x="146" y="64" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9A4440">COMMAND PALETTE</text>
  <text class="lbl" x="814" y="64" text-anchor="end" font-size="13" fill="#6b6870">anywhere in the portal</text>

  <!-- search field -->
  <rect x="48" y="92" width="784" height="58" rx="14" fill="#f4f1ee" stroke="#101012" stroke-width="2.5" />
  <circle cx="80" cy="117" r="9" fill="none" stroke="#101012" stroke-width="3" />
  <path d="M86.5 123.5 L94 131" stroke="#101012" stroke-width="3" stroke-linecap="round" />
  <rect class="caret" x="112" y="106" width="3" height="30" fill="#9A4440" />
  <text class="lbl" x="128" y="129" font-size="18" fill="#6b6870">Search mail, people and events</text>

  <rect x="731" y="108" width="44" height="32" rx="9" fill="#9A4440" />
  <rect x="727" y="104" width="44" height="32" rx="9" fill="#ffffff" stroke="#101012" stroke-width="2.5" />
  <text class="lbl" x="749" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#101012">⌘</text>
  <rect x="787" y="108" width="44" height="32" rx="9" fill="#9A4440" />
  <rect x="783" y="104" width="44" height="32" rx="9" fill="#ffffff" stroke="#101012" stroke-width="2.5" />
  <text class="lbl" x="805" y="127" text-anchor="middle" font-size="16" font-weight="700" fill="#101012">K</text>

  <text class="lbl" x="48" y="180" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#9A4440">ONE BOX, EVERY SOURCE</text>

  <!-- result rows -->
  <g>
    <rect x="48" y="192" width="784" height="46" rx="12" fill="#fff1f1" stroke="#9A4440" stroke-width="2.5" />
    <rect x="64" y="202" width="26" height="26" rx="8" fill="#9A4440" />
    <text class="mono" x="77" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">&gt;</text>
    <text class="lbl" x="104" y="221" font-size="16" font-weight="600" fill="#101012">Compose a message</text>
    <rect x="706" y="202" width="112" height="26" rx="13" fill="#ffffff" stroke="#9A4440" stroke-width="2" />
    <text class="lbl" x="762" y="219" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9A4440">COMMAND</text>
  </g>

  <g>
    <rect x="48" y="246" width="784" height="46" rx="12" fill="#ffffff" stroke="#e2dcd6" stroke-width="2" />
    <rect x="64" y="256" width="26" height="26" rx="8" fill="#101012" />
    <path d="M70 263 h14 v12 h-14 z M70 263 l7 6 l7 -6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
    <text class="mono" x="104" y="275" font-size="15" fill="#101012">in:inbox is:unread</text>
    <rect x="706" y="256" width="112" height="26" rx="13" fill="#f4f1ee" stroke="#c9c2bb" stroke-width="2" />
    <text class="lbl" x="762" y="273" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#55525a">MAIL</text>
  </g>

  <g>
    <rect x="48" y="300" width="784" height="46" rx="12" fill="#ffffff" stroke="#e2dcd6" stroke-width="2" />
    <rect x="64" y="310" width="26" height="26" rx="8" fill="#101012" />
    <rect x="69" y="316" width="16" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <path d="M69 321 h16" stroke="#ffffff" stroke-width="1.8" />
    <text class="lbl" x="104" y="329" font-size="16" font-weight="600" fill="#101012">Create an event</text>
    <rect x="706" y="310" width="112" height="26" rx="13" fill="#f4f1ee" stroke="#c9c2bb" stroke-width="2" />
    <text class="lbl" x="762" y="327" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#55525a">EVENTS</text>
  </g>

  <path d="M48 372 H832" stroke="#e2dcd6" stroke-width="2" />

  <text class="lbl" x="48" y="398" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#9A4440">MAIL OPERATORS</text>
  <text class="lbl" x="196" y="398" font-size="12.5" fill="#6b6870">— Tab completes them, and in: knows your folders</text>
  <text class="lbl" x="814" y="398" text-anchor="end" font-size="12.5" fill="#6b6870">searches skip the bin and junk</text>

  <g>
    <rect x="48" y="410" width="63" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="79.5" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">from:</text>
    <rect x="121" y="410" width="47" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="144.5" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">to:</text>
    <rect x="178" y="410" width="86" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="221" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">subject:</text>
    <rect x="274" y="410" width="47" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="297.5" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">in:</text>
    <rect x="331" y="410" width="133" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="397.5" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">has:attachment</text>
    <rect x="474" y="410" width="94" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="521" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">is:unread</text>
    <rect x="578" y="410" width="102" height="30" rx="15" fill="#f4f1ee" stroke="#101012" stroke-width="2" />
    <text class="mono" x="629" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#101012">is:starred</text>
  </g>

</svg>
