<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="Webmail">
  <title>Webmail</title>
  <style>
    .unread { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .unread { animation: none; } }
  </style>
  <rect x="10" y="10" width="60" height="60" rx="16" fill="#000000" />
  <rect x="6" y="6" width="60" height="60" rx="16" fill="#9A4440" stroke="#000000" stroke-width="2.5" />
  <!-- envelope -->
  <rect x="17" y="25" width="38" height="26" rx="3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <path d="M18 27 L36 40 L54 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- unread badge -->
  <circle class="unread" cx="55" cy="24" r="6" fill="#ffd84d" stroke="#000000" stroke-width="2" />
</svg>
