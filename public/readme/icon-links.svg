<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="Links">
  <title>Links</title>
  <rect x="10" y="10" width="60" height="60" rx="16" fill="#000000" />
  <rect x="6" y="6" width="60" height="60" rx="16" fill="#9A4440" stroke="#000000" stroke-width="2.5" />
  <!-- two interlocking links that jiggle like a chain -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 36 38; -7 36 38; 7 36 38; 0 36 38" keyTimes="0;0.3;0.7;1" dur="1.6s" repeatCount="indefinite" />
    <rect x="19" y="30" width="22" height="14" rx="7" fill="none" stroke="#ffffff" stroke-width="3.5" transform="rotate(-35 30 37)" />
    <rect x="35" y="32" width="22" height="14" rx="7" fill="none" stroke="#ffffff" stroke-width="3.5" transform="rotate(-35 46 39)" />
  </g>
</svg>
