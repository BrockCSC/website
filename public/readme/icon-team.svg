<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="Team">
  <title>Team</title>
  <rect x="10" y="10" width="60" height="60" rx="16" fill="#000000" />
  <rect x="6" y="6" width="60" height="60" rx="16" fill="#9A4440" stroke="#000000" stroke-width="2.5" />
  <!-- two people that bob gently, like the member badge in the banner -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
    <!-- back person -->
    <circle cx="46" cy="31" r="6" fill="#ffd1cf" />
    <rect x="37" y="42" width="18" height="12" rx="7" fill="#ffd1cf" />
    <!-- front person -->
    <circle cx="30" cy="33" r="7.5" fill="#ffffff" />
    <rect x="19" y="45" width="23" height="12" rx="8" fill="#ffffff" />
  </g>
</svg>
