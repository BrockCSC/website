<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="CS Guide">
  <title>CS Guide</title>
  <rect x="10" y="10" width="60" height="60" rx="16" fill="#000000" />
  <rect x="6" y="6" width="60" height="60" rx="16" fill="#9A4440" stroke="#000000" stroke-width="2.5" />
  <!-- open book -->
  <rect x="19" y="24" width="17" height="30" rx="2" fill="#ffffff" />
  <rect x="40" y="24" width="17" height="30" rx="2" fill="#ffffff" />
  <rect x="36" y="24" width="4" height="30" fill="#7a3532" />
  <!-- text lines, left page -->
  <rect x="23" y="30" width="9" height="2" rx="1" fill="#cf9d9b" />
  <rect x="23" y="35" width="9" height="2" rx="1" fill="#cf9d9b" />
  <rect x="23" y="40" width="7" height="2" rx="1" fill="#cf9d9b" />
  <!-- turning page -->
  <path d="M40 25 L56 25 L56 53 L40 53 Z" fill="#ffffff" stroke="#9A4440" stroke-width="1.2" stroke-linejoin="round">
    <animate attributeName="d" values="M40 25 L56 25 L56 53 L40 53 Z; M40 25 L47 22 L49 52 L40 53 Z; M40 25 L56 25 L56 53 L40 53 Z" dur="2.6s" repeatCount="indefinite" />
  </path>
</svg>
