<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" width="76" height="76" role="img" aria-label="Home">
  <title>Home</title>
  <rect x="10" y="10" width="60" height="60" rx="16" fill="#000000" />
  <rect x="6" y="6" width="60" height="60" rx="16" fill="#9A4440" stroke="#000000" stroke-width="2.5" />
  <!-- roof + body -->
  <path d="M19 35 L36 19 L53 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="23" y="34" width="26" height="21" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <!-- door -->
  <rect x="33" y="44" width="8" height="11" fill="#ffffff" />
  <!-- window with a pulsing light -->
  <rect x="27" y="39" width="7" height="7" rx="1" fill="#ffd84d">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </rect>
</svg>
