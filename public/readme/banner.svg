<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Brock Computer Science Club — Code. Connect. Create.">
  <title>Brock Computer Science Club — Code. Connect. Create.</title>

  <style>
    /* CSS animation rather than SMIL: SMIL cannot be switched off by a media
       query, and this banner has to sit still for prefers-reduced-motion.
       Every animated part is an accent whose resting state is invisible or
       neutral, so nothing here is load-bearing if animation never runs. */
    .caret { opacity: 0; animation: caret 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s; }
    .badge { animation: bob 3.2s ease-in-out infinite; }

    @keyframes caret { 0% { transform: translateX(0); opacity: 1; } 86% { opacity: 1; } 100% { transform: translateX(366px); opacity: 0; } }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      .caret, .badge { animation: none; }
    }
  </style>

  <!-- hard offset shadow block (flat, no blur) -->
  <rect x="26" y="26" width="820" height="244" rx="26" fill="#9A4440" />

  <!-- main card -->
  <rect x="16" y="16" width="820" height="244" rx="26" fill="#ffffff" stroke="#000000" stroke-width="3" />

  <!-- top-left "welcome" pill -->
  <rect x="51" y="43" width="250" height="34" rx="17" fill="#9A4440" />
  <rect x="48" y="40" width="250" height="34" rx="17" fill="#fff1f1" stroke="#9A4440" stroke-width="2" />
  <text x="173" y="62" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#9A4440">WELCOME TO THE CLUB</text>

  <!-- floating member badge (mirrors the site's hover:-translate-y micro-interaction) -->
  <g class="badge">
    <rect x="566" y="44" width="250" height="48" rx="24" fill="#000000" />
    <rect x="560" y="38" width="250" height="48" rx="24" fill="#9A4440" stroke="#000000" stroke-width="3" />
    <text x="586" y="69" font-family="'Courier New', ui-monospace, monospace" font-size="22" font-weight="700" fill="#ffffff">&lt;&gt;</text>
    <text x="626" y="68" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5" fill="#ffffff">900+ MEMBERS</text>
  </g>

  <!-- wordmark -->
  <text x="48" y="146" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="900" letter-spacing="-1" fill="#111111">BROCK</text>
  <text x="300" y="146" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="900" letter-spacing="-1" fill="#9A4440">CSC</text>
  <rect x="300" y="155" width="134" height="9" rx="1" fill="#9A4440" />

  <!-- tagline, with a caret that types its way across it once and then clears -->
  <text x="48" y="196" font-family="'Courier New', ui-monospace, monospace" font-size="27" font-weight="700" fill="#333333">Code. Connect. Create.</text>
  <rect class="caret" x="48" y="172" width="4" height="30" fill="#9A4440" />

  <!-- what lives in this one repo -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9A4440">
    <rect x="48"  y="214" width="132" height="28" rx="14" fill="#fff1f1" stroke="#9A4440" stroke-width="2" />
    <text x="114" y="232" text-anchor="middle">PUBLIC SITE</text>

    <rect x="192" y="214" width="146" height="28" rx="14" fill="#fff1f1" stroke="#9A4440" stroke-width="2" />
    <text x="265" y="232" text-anchor="middle">ADMIN PORTAL</text>

    <rect x="350" y="214" width="146" height="28" rx="14" fill="#fff1f1" stroke="#9A4440" stroke-width="2" />
    <text x="423" y="232" text-anchor="middle">CLUB WEBMAIL</text>
  </g>
</svg>
